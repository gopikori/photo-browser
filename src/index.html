<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Photo Browser</title>
<style>
  :root { color-scheme: dark; --bg:#111; --panel:#1c1c1c; --panel2:#252525; --text:#eee; --muted:#888; --accent:#ffb86b; --danger:#ef5350; --select:#4fc3f7; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--text); font-family: -apple-system, system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--panel); border-bottom:1px solid #333; flex-wrap:wrap; }
  header h1 { margin:0; font-size:15px; font-weight:600; }
  header .root { color:var(--muted); font-size:12px; font-family:monospace; }
  header .spacer { flex:1; }
  header button, .btn { background:var(--panel2); color:var(--text); border:1px solid #444; padding:6px 12px; font-size:13px; border-radius:4px; cursor:pointer; }
  header button:hover, .btn:hover { background:#333; }
  header button.primary { background:var(--accent); color:#000; border-color:var(--accent); font-weight:600; }
  header button.primary:disabled { background:#444; color:#888; cursor:not-allowed; border-color:#444; }
  header button.danger { background:var(--danger); color:#fff; border-color:var(--danger); }
  .count { color:var(--muted); font-size:12px; }

  main { height: calc(100vh - 51px); overflow:hidden; }
  .view { display:none; height:100%; }
  .view.active { display:flex; }

  /* grid view */
  #grid { flex-direction: column; }
  #grid .scroll { flex:1; overflow-y:auto; padding:10px; }
  .thumbs { display:grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap:8px; }
  .tile { position:relative; aspect-ratio: 3/2; background:#000; border-radius:4px; overflow:hidden; cursor:pointer; border:2px solid transparent; }
  .tile img { width:100%; height:100%; object-fit:cover; display:block; }
  .tile .nm { position:absolute; bottom:4px; left:4px; background:rgba(0,0,0,0.75); padding:2px 6px; font-size:10px; font-family:monospace; border-radius:3px; }
  .tile .idx { position:absolute; top:4px; left:4px; background:rgba(0,0,0,0.75); padding:2px 6px; font-size:10px; border-radius:3px; }
  .tile.selected { border-color: var(--select); }
  .tile .check { position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%; background:rgba(0,0,0,0.6); border:1px solid #888; display:none; align-items:center; justify-content:center; color:#fff; font-size:12px; }
  .tile.selected .check { display:flex; background: var(--select); border-color: var(--select); color:#000; font-weight:700; }

  /* single view */
  #single { flex-direction: column; }
  #single .canvas { flex:1; display:flex; align-items:center; justify-content:center; background:#000; position:relative; overflow:hidden; }
  #single .canvas.zoomed { display:block; overflow:auto; }
  #single img { max-width:100%; max-height:100%; object-fit:contain; cursor: zoom-in; transform-origin: center center; transition: transform 0.18s ease; }
  #single .canvas.zoomed img { max-width:none; max-height:none; object-fit:initial; cursor: zoom-out; display:block; transition: none; }
  #single .nav { position:absolute; top:50%; transform:translateY(-50%); background:rgba(0,0,0,0.6); color:#fff; border:none; font-size:28px; width:48px; height:64px; cursor:pointer; user-select:none; z-index:5; }
  #single .canvas.zoomed .nav { position: fixed; }
  #single .prev { left:8px; border-radius:0 4px 4px 0; }
  #single .next { right:8px; border-radius:4px 0 0 4px; }
  #single .meta { padding:8px 16px; background:var(--panel); font-family:monospace; font-size:12px; display:flex; gap:16px; align-items:center; }
  #single .meta .filename { color: var(--accent); }

  /* compare view */
  #compare { flex-direction: column; }
  #compare .pair { flex:1; display:flex; gap:4px; background:#000; overflow:hidden; }
  #compare .side { flex:1; display:flex; flex-direction:column; overflow:hidden; }
  #compare .side .imgwrap { flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; }
  #compare .side img { max-width:100%; max-height:100%; object-fit:contain; }
  #compare .side .lbl { padding:6px 10px; background:var(--panel); font-family:monospace; font-size:12px; display:flex; justify-content:space-between; align-items:center; }
  #compare .side .lbl .nm { color: var(--accent); }

  .empty { padding:40px; text-align:center; color:var(--muted); }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#222; border:1px solid #444; padding:10px 18px; border-radius:6px; font-size:13px; z-index:1000; box-shadow:0 4px 16px rgba(0,0,0,0.4); }
  .toast.err { border-color: var(--danger); }
  kbd { background:#333; border:1px solid #555; border-radius:3px; padding:1px 5px; font-family:monospace; font-size:11px; }

  /* welcome (no folder loaded) */
  .welcome { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; color:var(--muted); }
  .welcome h2 { margin:0; color:var(--text); font-weight:600; }
  .welcome p { margin:0; font-size:13px; max-width:420px; text-align:center; line-height:1.5; }
  .welcome button { font-size:14px; padding:10px 20px; }

</style>
</head>
<body>

<header>
  <h1>📷 Photo Browser</h1>
  <span class="root" id="root-label"></span>
  <span class="count" id="count-label"></span>
  <span class="spacer"></span>
  <button id="btn-open" class="primary">📁 Open folder</button>
  <button id="btn-refresh" title="Re-sort & reload after adding photos">⟳</button>
  <button id="btn-grid">Grid</button>
  <button id="btn-single">Single</button>
  <button id="btn-compare" class="primary" disabled>Compare (0)</button>
  <button id="btn-clear-sel">Clear sel</button>
  <span class="count"><kbd>←</kbd> <kbd>→</kbd> nav · <kbd>g</kbd>rid · <kbd>s</kbd>ingle · <kbd>c</kbd>ompare · <kbd>z</kbd>oom · <kbd>r</kbd>otate · <kbd>Esc</kbd> · <kbd>Del</kbd></span>
</header>

<main>

  <section class="view active" id="grid">
    <div class="welcome" id="welcome" style="display:none">
      <h2>📷 No folder open</h2>
      <p>Pick a folder of photos to start culling. Loose JPEGs, RAWs and videos
         get sorted into <code>jpegs/</code>, <code>raws/</code> and <code>videos/</code> automatically.</p>
      <button class="primary" id="welcome-open">📁 Choose a folder…</button>
    </div>
    <div class="scroll" id="grid-scroll">
      <div class="thumbs" id="thumbs"></div>
      <div class="empty" id="grid-empty" style="display:none">No photos found.</div>
    </div>
  </section>

  <section class="view" id="single">
    <div class="canvas">
      <button class="nav prev" id="prev-btn" title="Previous (←)">‹</button>
      <img id="single-img" alt="">
      <button class="nav next" id="next-btn" title="Next (→)">›</button>
    </div>
    <div class="meta">
      <span class="filename" id="single-name"></span>
      <span id="single-pos"></span>
      <span class="spacer" style="flex:1"></span>
      <button class="btn" id="single-rot-l" title="Rotate left (Shift+R)">↺</button>
      <button class="btn" id="single-rot-r" title="Rotate right (R)">↻</button>
      <button class="btn" id="single-zoom">Zoom 100%</button>
      <button class="btn" id="single-select">Select for compare</button>
      <button class="btn danger" id="single-delete">Delete</button>
    </div>
  </section>

  <section class="view" id="compare">
    <div class="pair">
      <div class="side">
        <div class="lbl"><span class="nm" id="cmp-a-name"></span>
          <span><button class="btn" id="cmp-a-delete">Delete</button></span>
        </div>
        <div class="imgwrap"><img id="cmp-a" alt=""></div>
      </div>
      <div class="side">
        <div class="lbl"><span class="nm" id="cmp-b-name"></span>
          <span><button class="btn" id="cmp-b-delete">Delete</button></span>
        </div>
        <div class="imgwrap"><img id="cmp-b" alt=""></div>
      </div>
    </div>
  </section>

</main>

<script>
const state = {
  files: [],
  current: 0,
  selected: new Set(), // up to 2
  root: '',
  rawAvailable: false,
  videoAvailable: false,
  rotations: new Map(), // filename -> angle in degrees (0|90|180|270)
};

const $ = (id) => document.getElementById(id);

async function loadPhotos() {
  const res = await fetch('/api/photos');
  const data = await res.json();
  if (!data.loaded) {
    showWelcome(true);
    pickAndOpen(); // pop the native picker right away
    return;
  }
  applyPhotos(data);
}

function showWelcome(on) {
  $('welcome').style.display = on ? 'flex' : 'none';
  $('grid-scroll').style.display = on ? 'none' : 'block';
  const refresh = $('btn-refresh');
  if (refresh) refresh.disabled = on;
  if (on) {
    $('root-label').textContent = '(no folder)';
    $('count-label').textContent = '';
  }
}

// Adopt a freshly loaded folder (from /api/photos or /api/open) into the UI.
function applyPhotos(data) {
  showWelcome(false);
  state.files = data.files;
  state.root = data.root;
  state.rawAvailable = data.raw_available;
  state.videoAvailable = data.video_available;
  state.selected.clear();
  state.rotations.clear();
  state.current = 0;
  $('root-label').textContent = state.root;
  $('count-label').textContent = state.files.length + ' photos'
    + (state.rawAvailable ? ' · RAW' : '')
    + (state.videoAvailable ? ' · video' : '');
  renderGrid();
  updateSelectionUI();
  if (state.files.length > 0) renderSingle();
  showView('grid');
}

// ---------- native folder picker ----------
let picking = false;

async function pickAndOpen() {
  if (picking) return;
  picking = true;
  $('btn-open').disabled = true;
  try {
    const pickRes = await fetch('/api/pick', { method: 'POST' });
    const pickData = await pickRes.json();
    if (!pickData.ok) throw new Error(pickData.error || 'picker failed');
    if (!pickData.path) return; // user cancelled — silent
    toast('Sorting & opening…');
    const res = await fetch('/api/open', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: pickData.path }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'open failed');
    const r = data.report;
    toast(`Sorted ${r.jpegs} JPEG · ${r.raws} RAW · ${r.videos} video → ${data.photos.files.length} photos`);
    applyPhotos(data.photos);
  } catch (e) {
    toast('Open failed: ' + e.message, true);
  } finally {
    picking = false;
    $('btn-open').disabled = false;
  }
}

function renderGrid() {
  const host = $('thumbs');
  host.innerHTML = '';
  if (state.files.length === 0) { $('grid-empty').style.display = 'block'; return; }
  $('grid-empty').style.display = 'none';
  state.files.forEach((f, i) => {
    const tile = document.createElement('div');
    tile.className = 'tile' + (state.selected.has(f) ? ' selected' : '');
    tile.dataset.name = f;
    tile.innerHTML = `
      <img loading="lazy" src="/api/thumb/${encodeURIComponent(f)}" alt="${f}">
      <span class="idx">${i+1}</span>
      <span class="nm">${f}</span>
      <span class="check">✓</span>
    `;
    tile.addEventListener('click', (e) => {
      if (e.shiftKey || e.metaKey || e.ctrlKey) {
        toggleSelect(f);
      } else {
        state.current = i;
        renderSingle();
        showView('single');
      }
    });
    tile.addEventListener('dblclick', () => toggleSelect(f));
    host.appendChild(tile);
  });
}

function toggleSelect(f) {
  if (state.selected.has(f)) {
    state.selected.delete(f);
  } else {
    if (state.selected.size >= 2) {
      // evict oldest (first inserted)
      const first = state.selected.values().next().value;
      state.selected.delete(first);
    }
    state.selected.add(f);
  }
  updateSelectionUI();
}

function updateSelectionUI() {
  document.querySelectorAll('.tile').forEach(t => {
    t.classList.toggle('selected', state.selected.has(t.dataset.name));
  });
  const n = state.selected.size;
  const btn = $('btn-compare');
  btn.textContent = `Compare (${n})`;
  btn.disabled = n !== 2;
}

function renderSingle() {
  if (state.files.length === 0) return;
  if (state.current < 0) state.current = 0;
  if (state.current >= state.files.length) state.current = state.files.length - 1;
  const name = state.files[state.current];
  const img = $('single-img');
  // clear transform before swapping src so old rotation doesn't flash
  img.style.transform = '';
  img.src = '/api/image/' + encodeURIComponent(name);
  $('single-name').textContent = name;
  $('single-pos').textContent = `${state.current + 1} / ${state.files.length}`;
  const sel = state.selected.has(name);
  $('single-select').textContent = sel ? 'Deselect' : 'Select for compare';
  zoomOut();
  const onLoaded = () => applyRotation();
  if (img.complete && img.naturalWidth) onLoaded();
  else img.addEventListener('load', onLoaded, { once: true });
}

function currentName() {
  return state.files[state.current];
}

function applyRotation() {
  const img = $('single-img');
  const canvas = document.querySelector('#single .canvas');
  const name = currentName();
  const angle = ((state.rotations.get(name) || 0) % 360 + 360) % 360;
  if (!img.naturalWidth) { img.style.transform = ''; return; }
  // temporarily clear transform so we can measure the fit-scaled size
  img.style.transform = '';
  // In zoom mode, img is natural size; otherwise it's CSS-fit size.
  requestAnimationFrame(() => {
    let scale = 1;
    if (!isZoomed() && (angle === 90 || angle === 270)) {
      // when rotated 90/270, fit by swapping w/h against the canvas
      const iw = img.clientWidth, ih = img.clientHeight;
      const cw = canvas.clientWidth, ch = canvas.clientHeight;
      if (iw && ih && cw && ch) {
        scale = Math.min(cw / ih, ch / iw, 1);
      }
    }
    img.style.transform = angle === 0 ? '' : `rotate(${angle}deg) scale(${scale})`;
  });
}

function rotate(delta) {
  const name = currentName();
  if (!name) return;
  const cur = state.rotations.get(name) || 0;
  const next = ((cur + delta) % 360 + 360) % 360;
  if (next === 0) state.rotations.delete(name); else state.rotations.set(name, next);
  applyRotation();
}

function isZoomed() {
  return document.querySelector('#single .canvas').classList.contains('zoomed');
}

function zoomOut() {
  const canvas = document.querySelector('#single .canvas');
  canvas.classList.remove('zoomed');
  $('single-zoom').textContent = 'Zoom 100%';
}

function zoomInAt(clientX, clientY) {
  const img = $('single-img');
  const canvas = document.querySelector('#single .canvas');
  if (!img.naturalWidth) return;
  // compute click point as fraction of currently-displayed image
  const rect = img.getBoundingClientRect();
  let fracX = 0.5, fracY = 0.5;
  if (clientX != null) {
    fracX = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    fracY = Math.min(1, Math.max(0, (clientY - rect.top) / rect.height));
  }
  canvas.classList.add('zoomed');
  $('single-zoom').textContent = 'Fit';
  // after the browser applies natural sizing, scroll so click point is centered
  requestAnimationFrame(() => {
    const cw = canvas.clientWidth, ch = canvas.clientHeight;
    canvas.scrollLeft = Math.max(0, fracX * img.naturalWidth - cw / 2);
    canvas.scrollTop = Math.max(0, fracY * img.naturalHeight - ch / 2);
  });
}

function toggleZoom(clientX, clientY) {
  if (isZoomed()) zoomOut();
  else zoomInAt(clientX, clientY);
}

function renderCompare() {
  const arr = [...state.selected];
  if (arr.length !== 2) return;
  $('cmp-a').src = '/api/image/' + encodeURIComponent(arr[0]);
  $('cmp-b').src = '/api/image/' + encodeURIComponent(arr[1]);
  $('cmp-a-name').textContent = arr[0];
  $('cmp-b-name').textContent = arr[1];
}

function showView(v) {
  document.querySelectorAll('.view').forEach(el => el.classList.toggle('active', el.id === v));
  if (v === 'compare') renderCompare();
  if (v === 'single') renderSingle();
}

function next() { if (state.current < state.files.length - 1) { state.current++; renderSingle(); } }
function prev() { if (state.current > 0) { state.current--; renderSingle(); } }

function toast(msg, err) {
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2400);
}

async function deletePhoto(name) {
  if (!confirm(`Move ${name} to _deleted/ ?\n(The matching RAW will also move if present.)`)) return;
  try {
    const res = await fetch('/api/delete/' + encodeURIComponent(name), { method: 'POST' });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    toast(`Moved: ${data.deleted.join(', ')}`);
    state.files = state.files.filter(f => f !== name);
    state.selected.delete(name);
    if (state.current >= state.files.length) state.current = state.files.length - 1;
    $('count-label').textContent = state.files.length + ' photos' + (state.rawAvailable ? ' (raws present)' : '');
    renderGrid();
    updateSelectionUI();
    renderSingle();
  } catch (e) {
    toast('Delete failed: ' + e.message, true);
  }
}

async function rescan() {
  if (!state.root) return;
  const btn = $('btn-refresh');
  btn.disabled = true;
  const orig = btn.textContent;
  btn.textContent = '⟳ …';
  try {
    const res = await fetch('/api/rescan', { method: 'POST' });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'rescan failed');
    const r = data.report;
    const moved = r.jpegs + r.raws + r.videos;
    const before = state.files.length;
    applyPhotos(data.photos);
    const after = state.files.length;
    const delta = after - before;
    const msg = moved > 0
      ? `Sorted ${r.jpegs} JPEG · ${r.raws} RAW · ${r.videos} video → ${after} photos`
      : (delta > 0 ? `+${delta} new photos → ${after} total`
        : (delta < 0 ? `${delta} photos → ${after} total`
        : `No new photos (${after} total)`));
    toast(msg);
  } catch (e) {
    toast('Refresh failed: ' + e.message, true);
  } finally {
    btn.textContent = orig;
    btn.disabled = !state.root;
  }
}

// event wiring
$('btn-open').addEventListener('click', pickAndOpen);
$('welcome-open').addEventListener('click', pickAndOpen);
$('btn-refresh').addEventListener('click', rescan);
$('btn-refresh').disabled = true;
$('btn-grid').addEventListener('click', () => showView('grid'));
$('btn-single').addEventListener('click', () => showView('single'));
$('btn-compare').addEventListener('click', () => { if (state.selected.size === 2) showView('compare'); });
$('btn-clear-sel').addEventListener('click', () => { state.selected.clear(); updateSelectionUI(); });
$('prev-btn').addEventListener('click', (e) => { e.stopPropagation(); prev(); });
$('next-btn').addEventListener('click', (e) => { e.stopPropagation(); next(); });
$('single-img').addEventListener('click', (e) => { toggleZoom(e.clientX, e.clientY); });
$('single-zoom').addEventListener('click', () => { toggleZoom(); });
$('single-rot-l').addEventListener('click', () => rotate(-90));
$('single-rot-r').addEventListener('click', () => rotate(90));
window.addEventListener('resize', () => { if (document.querySelector('.view.active').id === 'single') applyRotation(); });
$('single-select').addEventListener('click', () => {
  if (state.files.length === 0) return;
  toggleSelect(state.files[state.current]);
  renderSingle();
});
$('single-delete').addEventListener('click', () => {
  if (state.files.length === 0) return;
  deletePhoto(state.files[state.current]);
});
$('cmp-a-delete').addEventListener('click', () => {
  const arr = [...state.selected]; if (arr[0]) deletePhoto(arr[0]);
});
$('cmp-b-delete').addEventListener('click', () => {
  const arr = [...state.selected]; if (arr[1]) deletePhoto(arr[1]);
});

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight') { next(); }
  else if (e.key === 'ArrowLeft') { prev(); }
  else if (e.key.toLowerCase() === 'g') { showView('grid'); }
  else if (e.key.toLowerCase() === 's') { showView('single'); }
  else if (e.key.toLowerCase() === 'c') { if (state.selected.size === 2) showView('compare'); }
  else if (e.key === ' ') {
    e.preventDefault();
    if (state.files.length > 0) { toggleSelect(state.files[state.current]); renderSingle(); }
  }
  else if (e.key === 'Delete' || e.key === 'Backspace') {
    const active = document.querySelector('.view.active').id;
    if (active === 'single' && state.files.length > 0) deletePhoto(state.files[state.current]);
  }
  else if (e.key === 'Escape') {
    const active = document.querySelector('.view.active').id;
    if (active === 'single' && isZoomed()) { zoomOut(); return; }
    if (active !== 'grid') showView('grid');
  }
  else if (e.key === 'z' || e.key === 'Z') {
    const active = document.querySelector('.view.active').id;
    if (active === 'single') toggleZoom();
  }
  else if (e.key === 'r' || e.key === 'R') {
    const active = document.querySelector('.view.active').id;
    if (active === 'single') rotate(e.shiftKey ? -90 : 90);
  }
});

loadPhotos();
</script>
</body>
</html>
